# cargo-deny (https://embarkstudios.github.io/cargo-deny/), run by
# `scripts/check.sh full`: known vulnerabilities and unmaintained crates,
# licenses, and where dependencies come from.

[graph]
all-features = true

[advisories]
# RustSec database. Unmaintained crates are reported too: a dependency
# nobody fixes is a risk. An exception goes into `ignore` with the advisory
# id and a comment why.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licenses only. A dependency under another license is a decision:
# add it here with a comment.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # Weak copyleft per file; common through `dirs` (option-ext).
    "MPL-2.0",
    # A data license; common through `webpki-roots` (rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The list is a superset; licenses no dependency uses are fine.
unused-allowed-license = "allow"

[licenses.private]
# Crates of this workspace that are not published need no license.
ignore = true

[bans]
# Duplicate versions deep in the tree are not ours to fix.
multiple-versions = "allow"
# `*` versions make builds unreproducible; workspace path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
